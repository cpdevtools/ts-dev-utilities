name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without pushing'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  publish-wiki:
    name: Publish Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish Wiki
        uses: cpdevtools/git-flow/actions/publish-wiki@main
        with:
          source: wiki
          dry-run: ${{ inputs.dry_run || 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
